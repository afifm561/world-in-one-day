<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The World in One Day — 27 November 2026</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #14161a;
    color: #e8e4dc;
    font: 14px/1.5 ui-sans-serif, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    padding: 20px 16px 32px;
  }
  .wrap { width: min(94vw, 1024px); display: grid; gap: 14px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .bar strong { font-size: 13.5px; letter-spacing: .2px; }
  button {
    font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 999px;
    border: 1px solid #3c424a; background: #24292f; color: inherit; cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  canvas { width: 100%; height: auto; display: block; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.55); }
  p { margin: 0; color: #98a0a8; font-size: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <strong>The World in One Day — Friday 27 November 2026</strong>
      <button id="save">Download entry.png · 1024×1024</button>
    </div>
    <canvas id="page" width="1024" height="1024"></canvas>
    <p>Export writes <code>entry.png</code> at exactly 1024×1024 from one deterministic canvas draw. If the download does not start on a phone, long-press the page and save the image. Commit it, then <code>main.ts</code> copies it to <code>/output/entry.png</code>.</p>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
